name: Build iOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone and iPad
        run: |
          set -o pipefail
          xcodebuild -project ExpressiveKeyboard.xcodeproj -scheme ExpressiveKeyboard -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/build.log"
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ExpressiveKeyboard.app Payload/
          test -x Payload/ExpressiveKeyboard.app/ExpressiveKeyboard
          test -x Payload/ExpressiveKeyboard.app/PlugIns/ExpressiveExtension.appex/ExpressiveExtension
          test -s Payload/ExpressiveKeyboard.app/PlugIns/ExpressiveExtension.appex/KeyboardData/lexicon.sqlite3
          ditto -c -k --keepParent Payload ExpressiveKeyboard-unsigned.ipa
          shasum -a 256 ExpressiveKeyboard-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-device
          path: |
            ExpressiveKeyboard-unsigned.ipa
            SHA256SUMS.txt
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExpressiveKeyboard-device
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Expressive Keyboard iOS $GITHUB_REF_NAME" --notes "Unsigned device build for iOS 17+. Installation requires signing both the app and keyboard extension with the same team. Keep app extensions when signing. App Groups are optional. See README.md." ExpressiveKeyboard-unsigned.ipa SHA256SUMS.txt
